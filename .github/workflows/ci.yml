name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    name: Resolve remote package from GitHub + build Demo for iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Not pinned: macos-15 images rotate their Xcode installs, and a hard-coded path
      # breaks when one is removed. The version is printed so every run is traceable.
      - name: Toolchain versions
        run: xcodebuild -version
      - name: Resolve the pinned remote package
        run: xcodebuild -resolvePackageDependencies -project Demo.xcodeproj -scheme Demo
      - name: Build Demo (compile-only, no device needed)
        run: |
          xcodebuild build \
            -project Demo.xcodeproj \
            -scheme Demo \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
